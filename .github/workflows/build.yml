# בונה את קובצי האתר מתוך content/site.json בכל שינוי תוכן, וגם פעם ביום
# (כדי שאירועים שעברו ייעלמו מ"השבוע בבארבור" מעצמם).
name: בניית האתר
on:
  push:
    branches: [main]
    paths: ['content/**', 'tools/**', 'site.css', 'site.js']
  schedule:
    - cron: '10 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: בנייה
        run: python3 tools/build.py
      - name: שמירת הקבצים הבנויים
        run: |
          git config user.name "barbur-site-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- '*.html'
          if git diff --cached --quiet; then echo "אין שינוי"; exit 0; fi
          git commit -m "בנייה אוטומטית של האתר"
          git push
