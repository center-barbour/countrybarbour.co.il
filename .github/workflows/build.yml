# בונה ומפרסם את האתר בכל שינוי במאגר, וגם פעם ביום
# (כדי שאירועים שעברו ייעלמו מ"השבוע בבארבור" מעצמם).
# לפני הפרסום רצה בדיקת נעילת העיצוב (DESIGN-LOCK.md): אם היא נכשלת, שום דבר לא עולה לאוויר.
name: בניית האתר
on:
  push:
    branches: [main]
  schedule:
    - cron: '10 0 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: בדיקת נעילת העיצוב
        run: python3 tools/check_design.py
      - name: בנייה
        run: python3 tools/build.py
      - name: בדיקת נעילת העיצוב אחרי הבנייה
        run: python3 tools/check_design.py
      - name: איסוף קבצי האתר לפרסום (בלי כלים, תוכן גולמי, צילומי ייחוס ומסמכים פנימיים)
        run: |
          mkdir _site
          cp *.html site.css site.js CNAME _site/
          cp -r m logo fonts admin _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
